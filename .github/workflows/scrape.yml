name: Scrape schedule sheet

# One cron per cadence tier. GitHub only lets crons be static, so the tiers are
# registered here and scripts/schedule-window.mjs decides, from the match times
# in the data, which tier the current moment belongs to - every run on the wrong
# cron exits in seconds. Tiers are disjoint, so two runs never overlap.
on:
  schedule:
    - cron: '*/15 * * * *'   # live:    a match is in progress
    - cron: '5,35 * * * *'   # watch:   an event starts within 36h, or just ended
    - cron: '17 3,15 * * *'  # idle:    between weekends (archive uses the 03:17 one only)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/scrape.yml'

permissions:
  contents: write

# Never let two runs race to commit the same file.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Uses the runner's preinstalled node, so a run on the wrong tier costs a
      # checkout and nothing else - no toolchain setup, no npm install.
      - name: Is this the right cadence for right now?
        id: gate
        run: node scripts/schedule-window.mjs --trigger "${{ github.event.schedule || github.event_name }}"

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
        if: steps.gate.outputs.run == 'true'

      # scripts/scrape.mjs exits non-zero if the sheet fails its structural
      # checks, which leaves the previously committed JSON in place rather than
      # publishing garbage.
      - name: Scrape
        if: steps.gate.outputs.run == 'true'
        run: node scripts/scrape.mjs

      - name: Commit if the data changed
        if: steps.gate.outputs.run == 'true'
        run: |
          if git diff --quiet -- docs/data/tournament.json; then
            echo "No change in tournament data."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/tournament.json
          DECIDED=$(node -p "require('./docs/data/tournament.json').tournament.decidedCount")
          TOTAL=$(node -p "require('./docs/data/tournament.json').tournament.matchCount")
          git commit -m "data: refresh schedule (${DECIDED}/${TOTAL} matches decided)"
          git push
